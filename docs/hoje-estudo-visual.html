<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Routine · Estudo visual da tela Hoje</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f0ebe3; --cream: #faf3e8; --paper: #fffdf9; --white: #fff;
      --ink: #253b57; --muted: #52637a; --line: #e5dbc9; --line-strong: #d2c3ad;
      --pink: #f4a6c1; --pink-ink: #a82d5f; --pink-wash: #fbe6ee; --water: #328093;
      --red: #ad362c; --quiet: #f3ebdf; --green: #2b7355;
      font: 15px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    button, input { font: inherit; }
    button, a, summary, input[type="checkbox"] { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; cursor: pointer; }
    button:disabled { cursor: default; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--pink-ink); outline-offset: 3px; }
    h1, h2, h3, h4, p, figure { margin: 0; }
    [hidden] { display: none !important; }
    .bar { background: var(--ink); color: var(--cream); }
    .bar-inner { min-height: 49px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .wrap { width: min(1120px, calc(100% - 56px)); margin-inline: auto; }
    .brand { font-weight: 800; font-size: 19px; letter-spacing: -.065em; }
    .brand span { color: var(--pink); }
    .bar a { font-size: 13px; text-underline-offset: 4px; }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding-block: 35px 22px; }
    h1 { font-size: clamp(30px, 5vw, 48px); font-weight: 710; line-height: 1.04; letter-spacing: -.06em; }
    .intro p { margin-top: 8px; color: var(--muted); font-size: 14px; }
    .compare, .option, .app-action {
      min-height: 42px; border: 1px solid var(--line-strong); border-radius: 4px;
      padding: 7px 12px; background: var(--paper); font-size: 13px; font-weight: 650;
    }
    .compare { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .compare[aria-pressed="true"] { color: var(--cream); border-color: var(--ink); background: var(--ink); }
    .compare-icon { width: 15px; height: 12px; border: 1px solid currentColor; display: inline-flex; }
    .compare-icon::after { content: ""; width: 50%; border-right: 1px solid currentColor; }
    .switcher { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line-strong); }
    .option { border: 0; border-right: 1px solid var(--line-strong); border-radius: 0; text-align: left; padding: 11px 15px; }
    .option:last-child { border-right: 0; }
    .option:hover { background: var(--cream); }
    .option[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
    .option small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
    .option[aria-pressed="true"] small { color: #e7d9cd; }
    .preview-tools { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; row-gap: 4px; min-height: 48px; padding: 10px 0; color: var(--muted); font-size: 13px; }
    .preview-tools a { margin-left: auto; color: var(--pink-ink); font-weight: 650; text-underline-offset: 3px; }
    .previews { display: grid; gap: 16px; }
    .previews.is-comparing { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .preview { background: var(--cream); border: 1px solid var(--line-strong); min-width: 0; }
    .preview-label { padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--paper); font-size: 13px; font-weight: 650; }
    .app { width: min(748px, 100%); margin-inline: auto; padding: 25px clamp(12px, 4vw, 38px) 30px; }
    .app-tab { display: table; margin-inline: auto; padding: 4px 12px; border-bottom: 2px solid var(--pink-ink); font-size: 13px; font-weight: 700; }
    .day-heading { text-align: center; padding: 15px 0 16px; }
    .day-heading > p:first-child { font-size: 11px; letter-spacing: .095em; text-transform: uppercase; font-weight: 700; }
    .day-heading h2 { font-size: clamp(19px, 3vw, 25px); letter-spacing: -.035em; }
    .day-heading > p:last-child { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .overview { display: grid; gap: 7px; margin-bottom: 13px; }
    .metric { border: 1px solid var(--line); background: var(--white); border-radius: 14px; padding: 10px 13px; }
    .metric-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
    .metric-head strong, .water strong, .time { font-variant-numeric: tabular-nums; }
    .metric-head > strong { font-size: 20px; letter-spacing: -.035em; line-height: 1; }
    .metric-head span, .water span { color: var(--muted); }
    .meter { height: 6px; background: var(--quiet); overflow: hidden; border-radius: 8px; }
    .meter i { height: 100%; display: block; background: var(--pink); }
    .progress .meter { margin-top: 7px; }
    .water { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
    .water p { align-items: center; display: flex; flex-wrap: wrap; gap: 4px; }
    .water .meter { width: clamp(38px, 17%, 100px); flex-shrink: 0; }
    .water .meter i { background: var(--water); }
    .drop { width: 9px; height: 9px; border: 1.5px solid var(--water); border-radius: 0 60% 60% 60%; transform: rotate(45deg); display: inline-block; margin: 0 5px 0 1px; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: 12px; }
    .actions h3 { font-size: 13px; margin-right: auto; }
    .app-action { padding-inline: 14px; min-height: 36px; }
    .app-action:not(:disabled):hover { border-color: var(--ink); }
    .group + .group { margin-top: 16px; }
    .group-title { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; font-size: 15px; font-weight: 710; letter-spacing: -.014em; }
    .group-title small { color: var(--muted); font-size: 11px; font-weight: 550; letter-spacing: 0; }
    .group[data-group="overdue"] .group-title { color: var(--red); }
    .rows { margin: 0; padding: 0; list-style: none; }
    .row { --category: #dfd6cd; min-width: 0; }
    .row[data-cat="Pessoal"] { --category: #f2bdd0; }
    .row[data-cat="Trabalho"] { --category: #cbc1b1; }
    .row[data-cat="Refeição"] { --category: #efca9e; }
    .row[data-cat="Estudo"] { --category: #bfcdf0; }
    .row[data-cat="Rotina diária"] { --category: #e8d481; }
    .row[data-cat="Condução"] { --category: #a9d0e8; }
    .row[data-cat="Treino"] { --category: #add9ba; }
    .row[data-cat="Aulas"] { --category: #d6c2eb; }
    .row-main { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; }
    .row.timed .row-main { grid-template-columns: 54px 42px minmax(0, 1fr) auto; }
    .time { font-size: 14px; font-weight: 750; letter-spacing: -.035em; line-height: 1.18; padding-left: 6px; }
    .time small { font-size: 10px; font-weight: 550; color: var(--muted); display: block; margin-top: 3px; letter-spacing: 0; }
    .task { overflow-wrap: anywhere; font-size: 14px; font-weight: 680; line-height: 1.2; padding-block: 3px; }
    .sub { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 6px; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .cat { display: inline-flex; align-items: center; gap: 4px; }
    .cat::before { content: ""; width: 7px; height: 7px; border-radius: 1px; background: var(--category); }
    .row[data-state="done"] .task { color: var(--muted); }
    .tick, .expand {
      width: 40px; height: 40px; padding: 0; display: grid; place-items: center; border: 0;
      border-radius: 4px; background: transparent;
    }
    .tick:hover, .expand:hover { background: var(--quiet); }
    .tick-mark {
      width: 17px; height: 17px; display: grid; place-items: center; border: 1.5px solid var(--line-strong);
      background: var(--white); border-radius: 3px; font-size: 12px; color: transparent;
    }
    .tick[aria-pressed="true"] .tick-mark { background: var(--pink); border-color: var(--pink-ink); color: var(--ink); }
    .chevron { width: 7px; height: 7px; border-bottom: 1.5px solid currentColor; border-right: 1.5px solid currentColor; transform: rotate(45deg) translateY(-2px); }
    .expand[aria-expanded="true"] .chevron { transform: rotate(225deg) translateY(-2px); }
    .detail { margin: 0 10px 0 46px; padding: 3px 0 8px 9px; border-left: 1px solid var(--line-strong); }
    .row.timed .detail { margin-left: 100px; }
    .detail h4 { color: var(--muted); font-size: 12px; margin-block: 4px; font-weight: 700; }
    .detail section + section { margin-top: 7px; }
    .step { display: flex; gap: 7px; align-items: center; min-height: 30px; font-size: 12px; cursor: pointer; }
    .step input { accent-color: var(--pink-ink); flex-shrink: 0; }
    .step small { color: var(--muted); }
    .order-tag { color: var(--red); }
    [data-layout="current"] .overview, [data-layout="current"] .actions { margin-bottom: 14px; }
    [data-layout="current"] .row { background: var(--white); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 7px; }
    [data-layout="current"] .row-main { min-height: 59px; padding: 7px 8px; }
    [data-layout="current"] .tick-mark { width: 23px; height: 23px; border-radius: 50%; }
    [data-layout="current"] .cat { background: var(--category); color: var(--ink); padding: 2px 6px; border-radius: 20px; }
    [data-layout="current"] .cat::before { display: none; }
    [data-layout="current"] .detail { background: var(--cream); border: 0; border-radius: 9px; padding: 5px 9px; margin-bottom: 8px; }
    [data-layout="list"] .rows { border-top: 1px solid var(--line-strong); }
    [data-layout="list"] .row { border-bottom: 1px solid var(--line); background: transparent; }
    [data-layout="list"] .row:hover { background: var(--paper); }
    [data-layout="table"] .group:not(.timeline) .row { border-bottom: 1px solid var(--line); background: var(--paper); }
    [data-layout="table"] .timeline .rows { background: var(--white); border: 1px solid var(--line-strong); }
    [data-layout="table"] .timeline .row { border-top: 1px solid var(--line); }
    [data-layout="table"] .timeline .row:nth-child(2n) { background: var(--paper); }
    [data-layout="table"] .row.timed .row-main, .column-head {
      grid-template-columns: 64px 42px minmax(0, 1fr) 92px 104px 40px;
      align-items: center; gap: 6px;
    }
    .column-head { display: none; }
    [data-layout="table"] .column-head {
      display: grid; padding: 7px 10px 7px 4px; background: var(--quiet); color: var(--muted);
      font-size: 11px; font-weight: 700;
    }
    .column-head span:first-child { padding-left: 6px; }
    .table-cat, .table-status { display: none; }
    [data-layout="table"] .row.timed :is(.table-cat, .table-status) { display: block; font-size: 11px; color: var(--muted); }
    [data-layout="table"] .row.timed .sub .cat { display: none; }
    [data-layout="table"] .row.timed .detail { margin-left: 116px; }
    [data-layout="agenda"] .group:not(.timeline) .row { background: var(--paper); border-bottom: 1px solid var(--line); }
    [data-layout="agenda"] .timeline .row {
      position: relative; margin-left: 60px; padding-left: 4px; background: var(--paper);
      border-left: 3px solid var(--category); border-bottom: 1px solid var(--line); min-height: 49px;
    }
    [data-layout="agenda"] .timeline .row + .row { margin-top: 6px; }
    [data-layout="agenda"] .timeline .time { position: absolute; left: -62px; top: 12px; }
    [data-layout="agenda"] .row.timed .row-main { grid-template-columns: 40px minmax(0, 1fr) auto; }
    [data-layout="agenda"] .row.timed .detail { margin-left: 46px; }
    .previews.is-comparing [data-layout="table"] .row.timed .row-main { grid-template-columns: 50px 36px minmax(0, 1fr) 36px; }
    .previews.is-comparing [data-layout="table"] .column-head { grid-template-columns: 50px 36px minmax(0, 1fr) 36px; }
    .previews.is-comparing [data-layout="table"] .timeline :is(.table-cat, .table-status, .col-cat, .col-status) { display: none; }
    .previews.is-comparing [data-layout="table"] .row.timed .sub .cat { display: inline-flex; }
    .previews.is-comparing [data-layout="table"] .row.timed .detail { margin-left: 94px; }
    .references { margin: 28px 0 36px; padding: 16px 0 0; border-top: 1px solid var(--line-strong); }
    .references h2 { font-size: 20px; letter-spacing: -.035em; margin-bottom: 10px; }
    .ref-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .ref { background: var(--paper); border: 1px solid var(--line-strong); min-width: 0; }
    .ref-image { display: block; aspect-ratio: 2 / 1; background: #eae6df; overflow: hidden; border-bottom: 1px solid var(--line); }
    .ref-image img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .ref-image:hover img { opacity: .87; }
    .ref figcaption { padding: 9px 12px 11px; }
    .ref figcaption a { font-size: 13px; font-weight: 700; text-underline-offset: 3px; }
    .ref figcaption p { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .original { margin-top: 14px; font-size: 13px; }
    .original summary { width: fit-content; padding: 8px 0; font-weight: 650; cursor: pointer; }
    .original img { display: block; width: 100%; max-width: 920px; border: 1px solid var(--line-strong); }
    dialog { color: var(--ink); background: var(--paper); border: 1px solid var(--line-strong); border-radius: 4px; padding: 19px; width: min(390px, calc(100% - 28px)); }
    dialog::backdrop { background: #253b5770; }
    dialog form { display: grid; gap: 10px; }
    dialog label { display: grid; gap: 3px; font-size: 13px; font-weight: 600; }
    dialog input { width: 100%; min-height: 38px; border: 1px solid var(--line-strong); padding: 5px 8px; color: inherit; background: var(--white); }
    .dialog-actions { display: flex; justify-content: end; gap: 8px; }
    .save { color: var(--cream); background: var(--ink); border-color: var(--ink); }
    @media (max-width: 760px) {
      .wrap { width: min(100% - 32px, 1120px); }
      .intro { padding-block: 25px 15px; gap: 12px; align-items: flex-start; flex-direction: column; }
      .option { padding-inline: 9px; }
      .previews.is-comparing { grid-template-columns: minmax(0, 1fr); }
      [data-layout="table"] .row.timed .row-main, [data-layout="table"] .column-head { grid-template-columns: 50px 36px minmax(0, 1fr) 36px; }
      [data-layout="table"] .timeline :is(.table-cat, .table-status, .col-cat, .col-status) { display: none; }
      [data-layout="table"] .row.timed .sub .cat { display: inline-flex; }
      [data-layout="table"] .row.timed .detail { margin-left: 94px; }
    }
    @media (max-width: 480px) {
      .switcher { grid-template-columns: repeat(2, 1fr); }
      .option:nth-child(2) { border-right: 0; }
      .option:nth-child(-n+2) { border-bottom: 1px solid var(--line-strong); }
      .app { padding-inline: 11px; }
      .ref-grid { grid-template-columns: minmax(0, 1fr); }
      .ref-image { aspect-ratio: 2.35 / 1; }
      .tick, .expand { height: 44px; }
      .step { min-height: 40px; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="wrap bar-inner"><span class="brand">routine<span>.</span></span><a href="#referencias">Referências visuais ↓</a></div>
  </header>
  <main class="wrap">
    <div class="intro">
      <div><h1>Estudo visual da tela Hoje</h1><p>O mesmo dia da conta de demonstração da Marina.</p></div>
      <button type="button" class="compare" aria-pressed="false"><i class="compare-icon" aria-hidden="true"></i> Comparar com o atual</button>
    </div>
    <div class="switcher" role="group" aria-label="Aparência da agenda">
      <button type="button" class="option" data-option="current" aria-pressed="false">Atual <small>Cartões arredondados</small></button>
      <button type="button" class="option" data-option="list" aria-pressed="true">Lista <small>Linhas e divisórias</small></button>
      <button type="button" class="option" data-option="table" aria-pressed="false">Tabela <small>Colunas alinhadas</small></button>
      <button type="button" class="option" data-option="agenda" aria-pressed="false">Agenda <small>Horário e faixa de cor</small></button>
    </div>
    <div class="preview-tools"><p id="option-note" aria-live="polite"></p><a href="#linha-do-tempo">Ver linha do tempo ↓</a></div>
    <div class="previews" id="previews"></div>

    const compare = document.querySelector(".compare");
    const dialog = document.querySelector("#add-item");
    const form = dialog.querySelector("form");
    const checkState = new Map();
    const expanded = new Set();
    let layout = "list";
    let comparing = false;
    let adding = "";
    let nextId = 0;

    const escape = value => String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[char]);
    const time = minute => minute == null ? "" : String(Math.floor(minute / 60)).padStart(2, "0") + ":" + String(minute % 60).padStart(2, "0");
    const liters = ml => new Intl.NumberFormat("pt-BR").format(ml / 1000) + " L";
    function done(item) {
      if (item.steps?.length) return item.steps.every(done);
      return checkState.get(item.id) ?? (item.status === "DONE" || item.done === true);
    }
    const progress = value => '<div class="meter" aria-hidden="true"><i style="width:' + value + '%"></i></div>';

    function overview() {
      const today = [...data.items, ...data.anytime].filter(item => item.status !== "SKIPPED");
      const counted = today.flatMap(item => item.steps.length ? item.steps : [item]);
      const completed = counted.filter(done).length;
      const percentage = counted.length ? Math.round(completed / counted.length * 100) : 0;
      return '<div class="overview"><section class="metric progress" aria-label="Progresso do dia">' +
        '<div class="metric-head"><span><b>' + completed + '</b> de ' + counted.length + ' feitos</span><strong>' + percentage + '%</strong></div>' +
        progress(percentage) + '</section><section class="metric water" aria-label="Água">' +
        '<p><i class="drop" aria-hidden="true"></i> Água <strong>' + liters(data.water.totalMl) + '</strong><span>de ' + liters(data.water.goalMl) + '</span></p>' +
        progress(Math.min(100, Math.round(data.water.totalMl / data.water.goalMl * 100))) + '</section></div>';
    }

    function details(item) {
      return [{ name: "Afazeres", steps: item.steps }, ...item.lists].filter(list => list.steps.length).map(list => {
        return '<section><h4>' + escape(list.name) + ' · ' + list.steps.filter(done).length + ' de ' + list.steps.length + '</h4>' +
          list.steps.map(step => '<label class="step"><input type="checkbox" data-mark="' + step.id + '"' +
            (done(step) ? ' checked' : '') + '><span>' + escape(step.name) +
            (step.minute == null ? '' : ' <small>· ' + time(step.minute) + '</small>') + '</span></label>').join('') + '</section>';
      }).join('');
    }

    function row(item, group, variant) {
      const timed = item.startMinute != null;
      const category = item.cat ? '<span class="cat">' + escape(item.cat) + '</span>' : '';
      const checked = done(item);
      const skipped = item.status === "SKIPPED";
      const expandable = item.steps.length > 0 || item.lists.length > 0;
      const open = expanded.has(item.id);
      const detailId = variant + "-detail-" + item.id;
      return '<li class="row' + (timed ? ' timed' : '') + '" data-cat="' + escape(item.cat) + '" data-state="' + (checked ? "done" : "pending") + '">' +
        '<div class="row-main">' + (timed ? '<div class="time">' + time(item.startMinute) +
          (item.endMinute == null ? '' : '<small>' + time(item.endMinute) + '</small>') + '</div>' : '') +
        '<button type="button" class="tick" data-mark="' + item.id + '" aria-label="' + (checked ? "Desmarcar " : "Marcar como feito: ") +
        escape(item.name) + '" aria-pressed="' + checked + '"' + (skipped ? ' disabled' : '') + '><i class="tick-mark" aria-hidden="true">✓</i></button>' +
        '<div><div class="task">' + escape(item.name) + '</div><div class="sub"><span>' + escape(item.kind) + '</span>' + category +
        (group === "overdue" && !checked ? '<span class="order-tag">Atrasada</span>' : '') + '</div></div>' +
        (timed ? '<span class="table-cat">' + (category || "—") + '</span><span class="table-status">' +
          (checked ? "Feito" : skipped ? "Não houve" : "Pendente") + '</span>' : '') +
        (expandable ? '<button class="expand" type="button" data-expand="' + item.id + '" aria-label="Afazeres de ' + escape(item.name) +
          '" aria-expanded="' + open + '" aria-controls="' + detailId + '"><i class="chevron" aria-hidden="true"></i></button>' : '') + '</div>' +
        (expandable ? '<div class="detail" id="' + detailId + '"' + (open ? '' : ' hidden') + '>' + details(item) + '</div>' : '') + '</li>';
    }

    function preview(variant) {
      const date = new Intl.DateTimeFormat("pt-BR", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" }).format(new Date(data.date + "T12:00:00Z"));
      const sections = groups.filter(([key]) => data[key].length).map(([key, title]) => {
        const headings = variant === "table" && key === "items"
          ? '<li class="column-head" aria-hidden="true"><span>Hora</span><span></span><span>Atividade</span><span class="col-cat">Categoria</span><span class="col-status">Situação</span></li>' : '';
        const anchor = variant === layout && key === "items" ? ' id="linha-do-tempo"' : '';
        return '<section class="group' + (key === "items" ? " timeline" : "") + '" data-group="' + key + '"' + anchor + '>' +
          '<h3 class="group-title">' + title + '<small>' + data[key].length + '</small></h3>' +
          '<ul class="rows">' + headings + data[key].map(item => row(item, key, variant)).join('') + '</ul></section>';
      }).join('');
      return '<article class="preview" data-layout="' + variant + '" aria-label="Opção ' + options[variant].name + '">' +
        (comparing ? '<h2 class="preview-label">' + options[variant].name + '</h2>' : '') +
        '<div class="app"><p class="app-tab">Dia</p><header class="day-heading"><p>Hoje</p><h2>' +
        escape(date.charAt(0).toUpperCase() + date.slice(1)) + '</h2><p>Olá, Marina!</p></header>' + overview() +
        '<section class="actions" aria-label="Adicionar"><h3>Adicionar</h3><button class="app-action" data-add="Fixo" type="button">Fixo</button>' +
        '<button class="app-action" data-add="Avulso" type="button">Avulso</button></section>' + sections + '</div></article>';
    }

    function render(target) {
      const attribute = target?.dataset.expand ? "data-expand" : target?.dataset.mark ? "data-mark" : target?.dataset.add ? "data-add" : null;
      const value = attribute ? target.getAttribute(attribute) : null;
      const focusedLayout = target?.closest(".preview")?.dataset.layout;
      const focusedDetail = target?.closest(".detail")?.id;
      view.classList.toggle("is-comparing", comparing);
      view.innerHTML = (comparing ? ["current", layout] : [layout]).map(preview).join('');
      const focusScope = focusedDetail ? view.querySelector("#" + focusedDetail) : view.querySelector('[data-layout="' + focusedLayout + '"]');
      if (attribute) focusScope?.querySelector('[' + attribute + '="' + value + '"]')?.focus({ preventScroll: true });
      document.querySelector("#option-note").textContent = options[layout].note;
      document.querySelectorAll("[data-option]").forEach(button => button.setAttribute("aria-pressed", button.dataset.option === layout));
      compare.disabled = layout === "current";
      compare.setAttribute("aria-pressed", comparing);
    }

    document.querySelector(".switcher").addEventListener("click", event => {
      const option = event.target.closest("[data-option]");
      if (!option) return;
      layout = option.dataset.option;
      if (layout === "current") comparing = false;
      render();
    });
    compare.addEventListener("click", () => {
      comparing = !comparing;
      render();
    });
    view.addEventListener("click", event => {
      const control = event.target.closest("[data-expand], [data-mark], [data-add]");
      if (!control || control instanceof HTMLInputElement) return;
      if (control.dataset.expand) {
        const id = control.dataset.expand;
        if (!expanded.delete(id)) expanded.add(id);
        render(control);
      } else if (control.dataset.mark) {
        const item = groups.flatMap(([group]) => data[group]).find(item => item.id === control.dataset.mark);
        const next = control.getAttribute("aria-pressed") !== "true";
        for (const entry of item.steps.length ? item.steps : [item]) checkState.set(entry.id, next);
        render(control);
      } else {
        adding = control.dataset.add;
        document.querySelector("#add-title").textContent = adding === "Fixo" ? "Novo fixo na prévia" : "Novo avulso na prévia";
        form.reset();
        dialog.showModal();
      }
    });
    view.addEventListener("change", event => {
      if (!event.target.matches("input[data-mark]")) return;
      checkState.set(event.target.dataset.mark, event.target.checked);
      render(event.target);
    });
    dialog.querySelector("[data-cancel]").addEventListener("click", () => dialog.close());
    form.addEventListener("submit", event => {
      event.preventDefault();
      const values = new FormData(form);
      const name = values.get("title").trim();
      if (!name) return;
      const selected = values.get("time");
      const [hours, minutes] = selected.split(":").map(Number);
      const item = { id: "preview-" + ++nextId, name, kind: adding, startMinute: selected ? hours * 60 + minutes : null, steps: [], lists: [] };
      if (selected) {
        data.items.push(item);
        data.items.sort((a, b) => a.startMinute - b.startMinute);
      } else data.anytime.push(item);
      dialog.close();
      render();
    });

    const work = data.items.find(item => item.name === "Trabalho" && item.steps.length);
    if (work) expanded.add(work.id);
    render();
  </script>
</body>
</html>
