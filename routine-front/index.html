<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="nuCorre — controle de rotina · bycauazin" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#faf3e8" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="nuCorre" />
    <title>nuCorre · bycauazin</title>
    <script>
      // Resolve the theme before first paint (no flash). Preference: "light" | "dark" | "system".
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("routine-theme") || "system"; } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
      // Opening animation (src/components/layout/SiteIntro.jsx): on every load of the landing page (/),
      // once per browser session elsewhere, never with reduced motion; ?intro forces it. data-intro is
      // set before first paint; a 7 s timer frees the page if the JavaScript fails.
      (function () {
        try {
          var d = document.documentElement, asked = /[?&]intro\b/.test(location.search);
          if (!asked && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          if (!asked && location.pathname !== "/" && sessionStorage.getItem("nucorre-intro")) return;
          d.setAttribute("data-intro", "on");
          setTimeout(function () { d.removeAttribute("data-intro"); }, 7000);
        } catch (e) {}
      })();
    </script>
    <style>
      /* Loading screen: the logo and a sliding bar while the bundle loads. It lives inside #root,
         so React replaces it on the first render. Page colors, or navy when the opening follows. */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 26px; background: #faf3e8; }
      .boot img { height: 96px; width: auto; animation: boot-breathe 1.6s ease-in-out infinite; }
      .boot .dark { display: none; }
      .boot-bar { position: relative; width: 120px; height: 3px; overflow: hidden; border-radius: 3px; background: rgb(37 59 87 / 0.12); }
      .boot-bar::after { position: absolute; inset: 0; width: 40%; content: ""; border-radius: 3px; background: #f4a6c1; animation: boot-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      html[data-theme="dark"] .boot { background: #16253a; }
      html[data-theme="dark"] .boot .light, html[data-intro="on"] .boot .light { display: none; }
      html[data-theme="dark"] .boot .dark, html[data-intro="on"] .boot .dark { display: block; }
      html[data-theme="dark"] .boot-bar, html[data-intro="on"] .boot-bar { background: rgb(250 243 232 / 0.14); }
      @keyframes boot-breathe { 50% { transform: scale(0.94); opacity: 0.8; } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot img, .boot-bar::after { animation: none; } }
      /* While the opening plays, its navy is already on screen (no flash of the page). */
      html[data-intro="on"], html[data-intro="on"] body, html[data-intro="on"] .boot { background: #253b57; overflow: hidden; }
      html[data-intro="on"] #root > :not(.intro):not(.boot) { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Carregando o nuCorre">
        <img class="light" src="/logo-sticker-light.svg?v=1" alt="" width="45" height="96" />
        <img class="dark" src="/logo-sticker.svg?v=1" alt="" width="45" height="96" />
        <span class="boot-bar"></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
