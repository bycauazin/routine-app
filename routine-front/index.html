<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="nuCorre — controle de rotina · bycauazin" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#faf3e8" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="nuCorre" />
    <title>nuCorre · bycauazin</title>
    <script>
      // Resolve the theme before first paint (no flash). Preference: "light" | "dark" | "system".
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("routine-theme") || "system"; } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
      // Opening animation (src/components/layout/SiteIntro.jsx): on every load of the landing page (/),
      // once per browser session elsewhere, never with reduced motion; ?intro forces it. data-intro is
      // set before first paint; a 7 s timer frees the page if the JavaScript fails.
      (function () {
        try {
          var d = document.documentElement, asked = /[?&]intro\b/.test(location.search);
          if (!asked && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          if (!asked && location.pathname !== "/" && sessionStorage.getItem("nucorre-intro")) return;
          d.setAttribute("data-intro", "on");
          setTimeout(function () { d.removeAttribute("data-intro"); }, 7000);
        } catch (e) {}
      })();
    </script>
    <style>
      /* Loading screen: the "Grade da semana" tiles (src/lib/grid-transition.js) already covering
         the screen. #boot sits outside #root so React does not wipe it; finishBoot() clears the
         tiles in the same diagonal wave, at least 0.5 s after the page opened. */
      #boot { position: fixed; inset: 0; z-index: 200; display: grid; background: #faf3e8; }
      #boot > span { transform: scale(1.08); }
      html[data-theme="dark"] #boot { background: #16253a; }
      /* While the opening plays, its navy is already on screen (no flash of the page or the tiles). */
      html[data-intro="on"], html[data-intro="on"] body { background: #253b57; overflow: hidden; }
      html[data-intro="on"] #root > :not(.intro) { visibility: hidden; }
      html[data-intro] #boot { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-label="Carregando o nuCorre"></div>
    <script>
      // Fill #boot with the tiles: same size, colors and diagonal stripes as grid-transition.js.
      (function () {
        var boot = document.getElementById("boot");
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var dark = document.documentElement.dataset.theme === "dark";
        var colors = dark
          ? ["#f4a6c1", "#faf3e8", "#22405e", "#2b3a68", "#3d3159", "#2c3a4e"]
          : ["#f4a6c1", "#253b57", "#dcebf7", "#d8e1f6", "#ecdff6", "#e6e2db"];
        var cols = Math.ceil(innerWidth / 88), rows = Math.ceil(innerHeight / 88), html = "";
        for (var r = 0; r < rows; r++)
          for (var c = 0; c < cols; c++)
            html += '<span style="background:' + colors[(((c - r) % 6) + 6) % 6] + '"></span>';
        boot.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
        boot.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";
        boot.dataset.cols = cols;
        boot.innerHTML = html;
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
